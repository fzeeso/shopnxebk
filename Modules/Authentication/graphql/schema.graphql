extend type Query {
    viewer: User! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Authentication\\GraphQL\\Queries\\Viewer")
    viewerStores: [Store!]! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Authentication\\GraphQL\\Queries\\ViewerStores")
}

type User {
    id: ID! @rename(attribute: "public_id")
    name: String!
    email: String!
    emailVerifiedAt: DateTime @rename(attribute: "email_verified_at")
}
