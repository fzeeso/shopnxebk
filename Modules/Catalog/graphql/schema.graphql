    sortOrder: Int! @rename(attribute: "sort_order")
    childrenCount: Int @rename(attribute: "children_count")
    productsCount: Int @rename(attribute: "products_count")
    translations: [CategoryTranslation!]!
    translation(locale: String!): CategoryTranslation @field(resolver: "Modules\\Catalog\\GraphQL\\Types\\CategoryTranslationForLocale")
    createdAt: DateTime! @rename(attribute: "created_at")
    updatedAt: DateTime! @rename(attribute: "updated_at")
}

