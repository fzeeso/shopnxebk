extend type Query {
    categories(page: Int = 1, perPage: Int = 20, filter: CategoryFilterInput, sortBy: CategorySortField = SORT_ORDER, sortDirection: CatalogSortDirection = ASC): CategoryPage! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\Queries\\ListCategories")
    category(id: ID!): CatalogCategory! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\Queries\\CategoryById")
    productTypes(page: Int = 1, perPage: Int = 20, filter: ProductTypeFilterInput, sortBy: ProductTypeSortField = SORT_ORDER, sortDirection: CatalogSortDirection = ASC): ProductTypePage! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\Queries\\ListProductTypes")
    productType(id: ID!): CatalogProductType! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\Queries\\ProductTypeById")
    products(page: Int = 1, perPage: Int = 20, filter: ProductFilterInput, sortBy: ProductSortField = CREATED_AT, sortDirection: CatalogSortDirection = DESC): ProductPage! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\Queries\\ListProducts")
    product(id: ID!): CatalogProduct! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\Queries\\ProductById")
    customFields(page: Int = 1, perPage: Int = 25, filter: CustomFieldFilterInput, sortBy: CustomFieldSortField = POSITION, sortDirection: CatalogSortDirection = ASC): CustomFieldPage! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\CustomFieldQueries@definitions")
    customField(id: ID!): CustomFieldDefinition! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\CustomFieldQueries@definition")
    productCustomFieldValues(productId: ID!, variantId: ID): [ProductCustomFieldValue!]! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\CustomFieldQueries@values")
    productCustomFieldValue(productId: ID!, definitionId: ID!, variantId: ID): ProductCustomFieldValue! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\CustomFieldQueries@value")
}

extend type Mutation {
    createCategory(input: CreateCategoryInput!): CategoryPayload! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\Mutations\\CreateCategory")
    updateCategory(id: ID!, input: UpdateCategoryInput!): CategoryPayload! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\Mutations\\UpdateCategory")
    deleteCategory(id: ID!): DeletedCatalogEntity! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\Mutations\\DeleteCategory")
    createProductType(input: CreateProductTypeInput!): ProductTypePayload! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\Mutations\\CreateProductType")
    updateProductType(id: ID!, input: UpdateProductTypeInput!): ProductTypePayload! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\Mutations\\UpdateProductType")
    deleteProductType(id: ID!): DeletedCatalogEntity! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\Mutations\\DeleteProductType")
    createProduct(input: CreateProductInput!): ProductPayload! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\Mutations\\CreateProduct")
    updateProduct(id: ID!, input: UpdateProductInput!): ProductPayload! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\Mutations\\UpdateProduct")
    deleteProduct(id: ID!): DeletedCatalogEntity! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\Mutations\\DeleteProduct")
    createCustomField(input: CreateCustomFieldInput!): CustomFieldPayload! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\CustomFieldMutations@createDefinition")
    updateCustomField(id: ID!, input: UpdateCustomFieldInput!): CustomFieldPayload! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\CustomFieldMutations@updateDefinition")
    deleteCustomField(id: ID!): DeletedCatalogEntity! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\CustomFieldMutations@deleteDefinition")
    createCustomFieldOption(definitionId: ID!, input: CreateCustomFieldOptionInput!): CustomFieldOptionPayload! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\CustomFieldMutations@createOption")
    updateCustomFieldOption(definitionId: ID!, id: ID!, input: UpdateCustomFieldOptionInput!): CustomFieldOptionPayload! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\CustomFieldMutations@updateOption")
    deleteCustomFieldOption(definitionId: ID!, id: ID!): DeletedCatalogEntity! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\CustomFieldMutations@deleteOption")
    setProductCustomFieldValue(productId: ID!, definitionId: ID!, variantId: ID, input: ProductCustomFieldValueInput!): ProductCustomFieldValuePayload! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\CustomFieldMutations@setValue")
    deleteProductCustomFieldValue(productId: ID!, definitionId: ID!, variantId: ID): DeletedCatalogEntity! @guard(with: ["sanctum"]) @field(resolver: "Modules\\Catalog\\GraphQL\\CustomFieldMutations@deleteValue")
}

enum CatalogSortDirection {
    ASC @enum(value: "ASC")
    DESC @enum(value: "DESC")
}

enum CategorySortField {
    SORT_ORDER @enum(value: "sortOrder")
    CREATED_AT @enum(value: "createdAt")
    UPDATED_AT @enum(value: "updatedAt")
}

enum ProductSortField {
    CREATED_AT @enum(value: "createdAt")
    UPDATED_AT @enum(value: "updatedAt")
    STATUS @enum(value: "status")
    PUBLISHED_AT @enum(value: "publishedAt")
}

enum ProductTypeSortField {
    SORT_ORDER @enum(value: "sortOrder")
    CODE @enum(value: "code")
    CREATED_AT @enum(value: "createdAt")
    UPDATED_AT @enum(value: "updatedAt")
}

enum CustomFieldType {
    TEXT @enum(value: "text")
    NUMBER @enum(value: "number")
    BOOLEAN @enum(value: "boolean")
    SELECT @enum(value: "select")
    MULTI_SELECT @enum(value: "multi_select")
    DATE @enum(value: "date")
    URL @enum(value: "url")
}

enum CustomFieldSortField {
    POSITION @enum(value: "position")
    FIELD_KEY @enum(value: "fieldKey")
    CREATED_AT @enum(value: "createdAt")
    UPDATED_AT @enum(value: "updatedAt")
}

type CatalogCategory {
