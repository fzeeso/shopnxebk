services:
  app:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      meilisearch: {condition: service_healthy}
    volumes: ["./storage:/app/storage"]

  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-shopnxe}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}

  redis:
    image: redis:8.2-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}

  meilisearch:
    image: getmeili/meilisearch:v1.16
    environment: {MEILI_NO_ANALYTICS: "true", MEILI_ENV: development}
    ports: ["7700:7700"]
    volumes: ["meili-data:/meili_data"]
    healthcheck: {test: ["CMD", "curl", "--fail", "http://localhost:7700/health"], interval: 10s, timeout: 5s, retries: 10}

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-change-me}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

volumes:
  postgres-data:
  meili-data:
  minio-data:
