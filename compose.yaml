services:
  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_MASTER_KEY: masterKey
    ports:
      - "127.0.0.1:7700:7700"

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
