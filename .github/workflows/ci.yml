name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env: {POSTGRES_DB: shopnxe_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d shopnxe_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.16
        ports: ["7700:7700"]
        env: {MEILI_NO_ANALYTICS: "true", MEILI_ENV: development}

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: shopnxe_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      SCOUT_DRIVER: database
      MAIL_MAILER: array
      PULSE_ENABLED: false
      TELESCOPE_ENABLED: false

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, pcntl, intl, zip, exif
          coverage: none
      - uses: ramsey/composer-install@v3
        with: {composer-options: "--prefer-dist --no-interaction"}
      - run: php artisan migrate --force
      - run: composer validate --strict
      - run: composer docs:check
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: php artisan test
