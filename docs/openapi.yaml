    post:
      tags: [Catalog Products]
      security: [{sanctum: []}]
      summary: Create a translated Product option and optional initial values
      description: Requires manage products. Adding an option is rejected while variants exist.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/CreateProductOptionRequest'}}
      responses:
        '201':
          description: Product option created
          content:
            application/json: {schema: {$ref: '#/components/schemas/ProductOptionResponse'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product not found in selected Store}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/store/products/{product}/options/{option}:
    parameters:
      - {$ref: '#/components/parameters/StoreId'}
      - {name: product, in: path, required: true, schema: {$ref: '#/components/schemas/PublicUlid'}}
      - {name: option, in: path, required: true, schema: {$ref: '#/components/schemas/PublicUlid'}}
    get:
      tags: [Catalog Products]
      security: [{sanctum: []}]
      summary: Read a nested Product option with translated values
      responses:
        '200':
          description: Product option
          content:
            application/json: {schema: {$ref: '#/components/schemas/ProductOptionResponse'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product or option not found in the nested Store/Product boundary}
    patch:
      tags: [Catalog Products]
      security: [{sanctum: []}]
      summary: Update option order or submitted locale rows
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/UpdateProductOptionRequest'}}
      responses:
        '200':
          description: Product option updated
          content:
            application/json: {schema: {$ref: '#/components/schemas/ProductOptionResponse'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product or option not found in the nested Store/Product boundary}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Catalog Products]
      security: [{sanctum: []}]
      summary: Delete an option when the Product has no variants
      responses:
        '204': {description: Product option deleted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product or option not found in the nested Store/Product boundary}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/store/products/{product}/options/{option}/values:
    parameters:
      - {$ref: '#/components/parameters/StoreId'}
      - {name: product, in: path, required: true, schema: {$ref: '#/components/schemas/PublicUlid'}}
      - {name: option, in: path, required: true, schema: {$ref: '#/components/schemas/PublicUlid'}}
    get:
      tags: [Catalog Products]
      security: [{sanctum: []}]
      summary: List translated values for a Product option
      responses:
        '200':
          description: Ordered Product option values
          content:
            application/json: {schema: {$ref: '#/components/schemas/ProductOptionValueListResponse'}}
