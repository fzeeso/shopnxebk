        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product or option not found}
    post:
      tags: [Catalog Products]
      security: [{sanctum: []}]
      summary: Add a translated value to a Product option
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/CreateProductOptionValueRequest'}}
      responses:
        '201':
          description: Product option value created
          content:
            application/json: {schema: {$ref: '#/components/schemas/ProductOptionValueResponse'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product or option not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/store/products/{product}/options/{option}/values/{value}:
    parameters:
      - {$ref: '#/components/parameters/StoreId'}
      - {name: product, in: path, required: true, schema: {$ref: '#/components/schemas/PublicUlid'}}
      - {name: option, in: path, required: true, schema: {$ref: '#/components/schemas/PublicUlid'}}
      - {name: value, in: path, required: true, schema: {$ref: '#/components/schemas/PublicUlid'}}
    get:
      tags: [Catalog Products]
      security: [{sanctum: []}]
      summary: Read one translated Product option value
      responses:
        '200':
          description: Product option value
          content:
            application/json: {schema: {$ref: '#/components/schemas/ProductOptionValueResponse'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product, option, or value not found in the nested boundary}
    patch:
      tags: [Catalog Products]
      security: [{sanctum: []}]
      summary: Update value order or submitted locale rows
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/UpdateProductOptionValueRequest'}}
      responses:
        '200':
          description: Product option value updated
          content:
            application/json: {schema: {$ref: '#/components/schemas/ProductOptionValueResponse'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product, option, or value not found in the nested boundary}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Catalog Products]
      security: [{sanctum: []}]
      summary: Delete an option value that no variant selects
      responses:
        '204': {description: Product option value deleted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product, option, or value not found in the nested boundary}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/store/products/{product}/variants:
    parameters:
      - {$ref: '#/components/parameters/StoreId'}
      - {name: product, in: path, required: true, schema: {$ref: '#/components/schemas/PublicUlid'}}
    get:
      tags: [Catalog Products]
      security: [{sanctum: []}]
      summary: Page multilingual sellable variants for a Product
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Paginated Product variants
          content:
            application/json: {schema: {$ref: '#/components/schemas/ProductVariantPageResponse'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product not found in selected Store}
    post:
      tags: [Catalog Products]
      security: [{sanctum: []}]
      summary: Create a complete Product variant combination
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/CreateProductVariantRequest'}}
      responses:
        '201':
          description: Product variant created
          content:
            application/json: {schema: {$ref: '#/components/schemas/ProductVariantResponse'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product or preferred image not found in the nested boundary}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/store/products/{product}/variants/{variant}:
    parameters:
      - {$ref: '#/components/parameters/StoreId'}
      - {name: product, in: path, required: true, schema: {$ref: '#/components/schemas/PublicUlid'}}
      - {name: variant, in: path, required: true, schema: {$ref: '#/components/schemas/PublicUlid'}}
    get:
      tags: [Catalog Products]
      security: [{sanctum: []}]
      summary: Read one multilingual Product variant
      responses:
        '200':
          description: Product variant
          content:
            application/json: {schema: {$ref: '#/components/schemas/ProductVariantResponse'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product or variant not found in the nested boundary}
    patch:
      tags: [Catalog Products]
      security: [{sanctum: []}]
      summary: Update commerce fields, translations, or the complete selection
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/UpdateProductVariantRequest'}}
      responses:
        '200':
          description: Product variant updated
          content:
            application/json: {schema: {$ref: '#/components/schemas/ProductVariantResponse'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product, variant, or preferred image not found in the nested boundary}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Catalog Products]
      security: [{sanctum: []}]
      summary: Delete a Product variant and synchronize has_variants
      responses:
        '204': {description: Product variant deleted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product or variant not found in the nested boundary}
  /api/v1/store/brands:
    get:
      tags: [Catalog Brands]
      security: [{sanctum: []}]
      summary: Page Brands for the selected Store
      parameters:
        - {$ref: '#/components/parameters/StoreId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200': {description: Paginated Store Brands with translations}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Catalog Brands]
      security: [{sanctum: []}]
      summary: Create a Brand with managed imagery and localized identity
      description: Requires manage products and at least one active Store-locale translation. The source is committed first; missing active locales are queued after commit from the submitted default-locale or first translation. Locked records are preserved and provider failure does not roll back the Brand.
      parameters: [{$ref: '#/components/parameters/StoreId'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/CreateBrandRequest'}}
          multipart/form-data: {schema: {$ref: '#/components/schemas/CreateBrandRequest'}}
      responses:
        '201': {description: Brand created}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/store/brands/{brand}:
    parameters:
      - {$ref: '#/components/parameters/StoreId'}
      - {name: brand, in: path, required: true, schema: {$ref: '#/components/schemas/PublicUlid'}}
    get:
      tags: [Catalog Brands]
      security: [{sanctum: []}]
      summary: Read a Brand from the selected Store
      responses:
        '200': {description: Brand with translations}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Brand not found in selected Store}
    patch:
      tags: [Catalog Brands]
      security: [{sanctum: []}]
      summary: Update Brand identity, managed imagery, or Store-language translations
      description: Requires manage products. The edit commits first, then a translation-bearing update queues every unlocked active Store locale through the server-side OpenAI integration while preserving locked rows. Provider failures are retried without rolling back the write.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/UpdateBrandRequest'}}
          multipart/form-data: {schema: {$ref: '#/components/schemas/UpdateBrandRequest'}}
      responses:
        '200': {description: Brand updated}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Brand not found in selected Store}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Catalog Brands]
      security: [{sanctum: []}]
      summary: Delete a Brand
      description: Requires manage products. Translations and managed media are removed; product brand references become null.
      responses:
        '204': {description: Brand deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Brand not found in selected Store}
  /api/v1/store/brands/{brand}/media/{collection}:
    get:
      tags: [Catalog Brands]
      summary: Stream Brand media from private storage
      description: Uses the short-lived relative `expires` and `signature` query values emitted in authenticated Brand responses. Only the `image` and `banner` collections are addressable.
      parameters:
        - {name: brand, in: path, required: true, schema: {$ref: '#/components/schemas/PublicUlid'}}
        - {name: collection, in: path, required: true, schema: {type: string, enum: [image, banner]}}
        - {name: expires, in: query, required: true, schema: {type: integer}}
        - {name: signature, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Brand media bytes
          headers:
            Cache-Control: {schema: {type: string}, description: Private short-lived browser cache directive.}
          content:
            image/avif: {schema: {type: string, contentEncoding: binary}}
            image/jpeg: {schema: {type: string, contentEncoding: binary}}
            image/png: {schema: {type: string, contentEncoding: binary}}
            image/webp: {schema: {type: string, contentEncoding: binary}}
        '403': {description: Signed URL is missing, modified, or expired}
        '404': {description: Brand or requested media does not exist}
  /graphql:
    post:
      summary: Lighthouse GraphQL endpoint
      description: See graphql/schema.graphql; authentication mutations are not exposed here.
      responses:
        '200': {description: GraphQL response envelope}
components:
  securitySchemes:
    sanctum: {type: http, scheme: bearer}
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PerPage:
      name: per_page
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
