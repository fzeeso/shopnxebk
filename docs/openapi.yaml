            application/json: {schema: {$ref: '#/components/schemas/ProductImageResponse'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product or image not found in the selected Store and nested Product boundary}
    patch:
