        '204': {description: Shared Product option deleted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Shared Product option not found in selected Store}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/store/products/{product}/shared-options:
    parameters:
