        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateStorePolicyRequest'}}}
      responses:
        '200': {description: Store policy updated}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Policy not found in selected Store}
        '422': {$ref: '#/components/responses/ValidationError'}
