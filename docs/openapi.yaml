openapi: 3.1.0
info:
  title: shopnxebk REST API
  version: 1.0.0
  description: Authentication, Store management, Platform settings, and Plans & Pricing endpoints. GraphQL is documented by the Lighthouse schema.
servers:
  - url: http://localhost:8000
tags:
  - name: Platform Accounts
    description: Platform staff and merchant provisioning for the separate admin frontend.
  - name: Platform Stores
    description: Searchable and paginated Store catalog administration for Platform staff.
  - name: Store Users
    description: Member and role management inside one selected Store.
  - name: Platform Settings
    description: Global SaaS language and currency configuration for the /admin/settings component.
paths:
  /api/health/live:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Process is responding
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /api/health/ready:
    get:
      summary: Readiness probe
      responses:
        '200': {description: Dependencies are ready}
        '503': {description: A required dependency is unavailable}
  /api/v1/auth/register:
    post:
      summary: Register a user and first store
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201': {description: User and store created}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/auth/login:
    post:
      summary: Start a stateful session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200': {description: Session established}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: Rate limited}
  /api/v1/auth/token:
    post:
      summary: Issue a store-scoped bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name, store_id]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
                device_name: {type: string, maxLength: 255}
                store_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: Public Store ULID}
      responses:
        '200': {description: Plain Store-bound token returned once; expires after 30 days by default}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {description: Rate limited}
  /api/v1/auth/me:
    get:
      security: [{sanctum: []}]
      summary: Current user
      responses:
        '200':
          description: User resource including exclusive account scope
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/auth/session:
    get:
      security: [{sanctum: []}]
      summary: Bootstrap the authenticated dashboard session
      description: Returns the current User and exclusive Platform Admin/Store Admin interface profile atomically.
      responses:
        '200':
          description: Current User and scoped interface access profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardSessionResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/auth/interfaces:
    get:
      security: [{sanctum: []}]
      summary: Resolve Platform Admin and Store Admin interfaces
      description: Returns stable Platform and Store keys, but exclusive user scope permits only one interface to be available.
      responses:
        '200':
          description: Scoped interface access profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessInterfacesResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/auth/logout:
    post:
      security: [{sanctum: []}]
      summary: Revoke the current session or token
      responses:
        '200': {description: Logged out}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/auth/stores:
    get:
      security: [{sanctum: []}]
      summary: List active memberships
      responses:
        '200':
          description: Public-safe Store resources
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Store'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {description: Platform account cannot list Stores}
  /api/v1/auth/tokens:
    get:
      security: [{sanctum: []}]
      summary: List the current account's personal access tokens
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Paginated personal access tokens
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PersonalAccessToken'}}
                  links: {$ref: '#/components/schemas/PaginationLinks'}
                  meta: {$ref: '#/components/schemas/PaginationMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/auth/forgot-password:
    post:
      summary: Queue a password reset notification
      responses:
        '202': {description: Generic response}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/auth/reset-password:
    post:
      summary: Reset a password with a broker token
      responses:
        '200': {description: Password reset}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/auth/verify-email/{id}/{hash}:
    get:
      summary: Verify a signed email link
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
        - {name: hash, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Email verified}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/platform/roles:
    get:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: List assignable Platform roles
      description: Requires Platform scope and manage platform users.
      responses:
        '200':
          description: Platform role names
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleListResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/platform/users:
    get:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: List Platform users
      description: Paginated; requires Platform scope and manage platform users.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Platform users and Platform roles
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedUserListResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: Create a Platform user
      description: Creates only a Platform-scoped identity and accepts only Platform roles.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateManagedUserRequest'}
      responses:
        '201':
          description: Platform user created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedUserResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/users/{user}:
    get:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: View a Platform user
      parameters:
        - {name: user, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
      responses:
        '200':
          description: Platform user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedUserResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Platform user not found}
    patch:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: Update a Platform user and Platform roles
      parameters:
        - {name: user, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateManagedUserRequest'}
      responses:
        '200': {description: Platform user updated}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Platform user not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/merchant-roles:
    get:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: List Store roles assignable during merchant provisioning
      description: Requires Platform scope and manage stores.
      responses:
        '200':
          description: Store role names
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleListResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/platform/merchants:
    get:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: List merchants
      description: Paginated Stores and their Store-scoped users/roles; requires manage stores.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Merchant list
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Merchant'}}
                  links: {$ref: '#/components/schemas/PaginationLinks'}
                  meta: {$ref: '#/components/schemas/PaginationMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: Create a merchant
      description: Atomically creates a Store user, Store, active membership, and Store roles; Owner is always included.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMerchantRequest'}
      responses:
        '201':
          description: Merchant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Merchant'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/merchants/{merchant}:
    get:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: View a merchant by Store ULID
      parameters:
        - {name: merchant, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
      responses:
        '200': {description: Merchant resource}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Merchant not found}
    patch:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: Update a merchant owner and Store
      description: Existing Store roles are preserved. A changed owner email becomes unverified.
      parameters:
        - {name: merchant, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMerchantRequest'}
      responses:
        '200': {description: Merchant updated}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Merchant not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/stores:
    get:
      tags: [Platform Stores]
      security: [{sanctum: []}]
      summary: Search, filter, sort, and paginate Stores
      description: Requires Platform scope and manage stores. Never send X-Store-ID.
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 120}, description: Case-insensitive name, legal name, slug, email, or primary-domain search.}
        - {name: status, in: query, schema: {type: string, enum: [pending, active, suspended, cancelled]}}
        - {name: business_type, in: query, schema: {type: string, enum: [ecommerce, b2b, services, digital, restaurant, marketplace]}}
        - {name: currency_code, in: query, schema: {type: string, pattern: '^[A-Za-z]{3}$'}}
        - {name: language_code, in: query, schema: {type: string}}
        - {name: country_code, in: query, schema: {type: string, pattern: '^[A-Za-z]{2}$'}}
        - {name: is_verified, in: query, schema: {type: boolean}}
        - {name: is_ai_enabled, in: query, schema: {type: boolean}}
        - {name: is_pos_enabled, in: query, schema: {type: boolean}}
        - {name: is_b2b_enabled, in: query, schema: {type: boolean}}
        - {name: is_marketplace_enabled, in: query, schema: {type: boolean}}
        - {name: created_from, in: query, schema: {type: string, format: date}}
        - {name: created_to, in: query, schema: {type: string, format: date}}
        - {name: sort, in: query, schema: {type: string, enum: [name, slug, status, created_at, updated_at], default: created_at}}
        - {name: direction, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200':
          description: Paginated Store catalog
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaginatedStoreResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Platform Stores]
      security: [{sanctum: []}]
      summary: Create an unassigned Store
      description: Requires manage stores. Creates no owner, membership, role, plan, or subscription; status defaults to pending.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePlatformStoreRequest'}
      responses:
        '201':
          description: Store created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/stores/{store}:
    parameters:
      - {name: store, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}, description: Public Store ULID}
    get:
      tags: [Platform Stores]
      security: [{sanctum: []}]
      summary: View a Store
      description: Requires Platform scope and manage stores.
      responses:
        '200':
          description: Store resource
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Store not found}
    patch:
      tags: [Platform Stores]
      security: [{sanctum: []}]
      summary: Edit a Store
      description: Internal Billing links, raw JSON, preferences, owner data, and roles are prohibited.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePlatformStoreRequest'}
      responses:
        '200':
          description: Store updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Store not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/store/roles:
    get:
      tags: [Store Users]
      security: [{sanctum: []}]
      summary: List roles for the selected Store
      parameters: [{$ref: '#/components/parameters/StoreId'}]
      responses:
        '200':
          description: Store role names
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleListResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/store/users:
    get:
      tags: [Store Users]
      security: [{sanctum: []}]
      summary: List users in the selected Store
      parameters:
        - {$ref: '#/components/parameters/StoreId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Paginated Store members, memberships, and Store roles
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedUserListResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Store Users]
      security: [{sanctum: []}]
      summary: Create a user in the selected Store
      description: Requires manage store members and manage store roles. Only Store roles are accepted.
      parameters: [{$ref: '#/components/parameters/StoreId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateManagedUserRequest'}
      responses:
        '201': {description: Store user and active membership created}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/settings/currencies:
    get:
      tags: [Platform Settings]
      security: [{sanctum: []}]
      summary: List the platform currency catalog
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Paginated platform currency catalog
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Currency'}
                  links: {$ref: '#/components/schemas/PaginationLinks'}
                  meta: {$ref: '#/components/schemas/PaginationMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Platform Settings]
      security: [{sanctum: []}]
      summary: Add a platform currency
      description: Requires a Platform-scoped user with manage platform settings. USD is reserved as the base currency.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCurrencyRequest'}
      responses:
        '201':
          description: Currency created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Currency'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/settings/currencies/{currency}:
    patch:
      tags: [Platform Settings]
      security: [{sanctum: []}]
      summary: Update a platform currency and its USD-relative rate
      description: Requires manage platform settings. Rates mean 1 USD equals X target currency units.
      parameters:
        - name: currency
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateCurrencyRequest'}
      responses:
        '200':
          description: Currency updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Currency'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Currency not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/settings/languages:
    get:
      tags: [Platform Settings]
      security: [{sanctum: []}]
      summary: List the platform language catalog
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Paginated platform language catalog
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Language'}
                  links: {$ref: '#/components/schemas/PaginationLinks'}
                  meta: {$ref: '#/components/schemas/PaginationMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Platform Settings]
      security: [{sanctum: []}]
      summary: Add a supported platform language
      description: Requires a Platform-scoped user with manage platform settings.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateLanguageRequest'}
      responses:
        '201':
          description: Language created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Language'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/settings/languages/{language}:
    patch:
      tags: [Platform Settings]
      security: [{sanctum: []}]
      summary: Update a supported platform language
      description: Requires manage platform settings. Locale is immutable after creation.
      parameters:
        - name: language
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateLanguageRequest'}
      responses:
        '200':
          description: Language updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Language'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Language not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/store/languages:
    get:
      security: [{sanctum: []}]
      summary: List active catalog languages and Store selection state
      parameters:
        - {$ref: '#/components/parameters/StoreId'}
      responses:
        '200':
          description: Store language settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreLanguagesResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      security: [{sanctum: []}]
      summary: Replace the Store language selection and default
      description: Requires an active Store member with manage store.
      parameters:
        - {$ref: '#/components/parameters/StoreId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateStoreLanguagesRequest'}
      responses:
        '200':
          description: Store language settings updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreLanguagesResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/stores:
    post:
      security: [{sanctum: []}]
      summary: Create an additional Store and Owner membership
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateStoreRequest'}
      responses:
        '201': {description: Store created}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/store:
    get:
      security: [{sanctum: []}]
      summary: View the selected Store profile
      parameters: [{$ref: '#/components/parameters/StoreId'}]
      responses:
        '200': {description: Store profile}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Store not found}
  /api/v1/store/profile:
    patch:
      security: [{sanctum: []}]
      summary: Update merchant-owned Store profile fields
      description: Requires manage store. Platform-controlled Billing, lifecycle, verification, entitlement, trial, and raw JSON fields are prohibited.
      parameters: [{$ref: '#/components/parameters/StoreId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateStoreProfileRequest'}
      responses:
        '200': {description: Updated Store}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/store/settings:
    get:
      security: [{sanctum: []}]
      summary: View Store locale, preferences, and read-only capabilities
      parameters: [{$ref: '#/components/parameters/StoreId'}]
      responses:
        '200': {description: Store settings}
        '403': {$ref: '#/components/responses/Forbidden'}
    patch:
      security: [{sanctum: []}]
      summary: Merge validated Store locale and preferences
      description: Currency and language must exist as active Platform catalog entries.
      parameters: [{$ref: '#/components/parameters/StoreId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateStoreSettingsRequest'}
      responses:
        '200': {description: Updated Store settings}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/plans:
    get:
      security: [{sanctum: []}]
      summary: List plans with feature/add-on assignments
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200': {description: Paginated plan catalog with data, links, and meta}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      security: [{sanctum: []}]
      summary: Create a plan
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanWriteRequest'}
      responses:
        '201': {description: Plan created}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/plans/{plan}:
    parameters:
      - {name: plan, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
    get:
      security: [{sanctum: []}]
      summary: View a plan
      responses:
        '200': {description: Plan resource}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Plan not found}
    patch:
      security: [{sanctum: []}]
      summary: Update a plan or its price
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanWriteRequest'}
      responses:
        '200': {description: Plan updated}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      security: [{sanctum: []}]
      summary: Remove an unassigned plan
      description: A plan referenced by a Store must be archived instead.
      responses:
        '204': {description: Plan removed}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/features:
    get:
      security: [{sanctum: []}]
      summary: List reusable features
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200': {description: Paginated feature catalog with data, links, and meta}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      security: [{sanctum: []}]
      summary: Create a reusable feature
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeatureWriteRequest'}
      responses:
        '201': {description: Feature created}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/features/{feature}:
    parameters:
      - {name: feature, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
    patch:
      security: [{sanctum: []}]
      summary: Update a reusable feature
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeatureWriteRequest'}
      responses:
        '200': {description: Feature updated}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      security: [{sanctum: []}]
      summary: Remove an unassigned feature
      responses:
        '204': {description: Feature removed}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/plans/{plan}/features/{feature}:
    parameters:
      - {name: plan, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
      - {name: feature, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
    put:
      security: [{sanctum: []}]
      summary: Add or update a plan feature/add-on
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanFeatureWriteRequest'}
      responses:
        '200': {description: Plan feature assignment}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      security: [{sanctum: []}]
      summary: Detach a feature from a plan
      responses:
        '204': {description: Feature detached}
        '403': {$ref: '#/components/responses/Forbidden'}
  /graphql:
    post:
      summary: Lighthouse GraphQL endpoint
      description: See graphql/schema.graphql; authentication mutations are not exposed here.
      responses:
        '200': {description: GraphQL response envelope}
components:
  securitySchemes:
    sanctum: {type: http, scheme: bearer}
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PerPage:
      name: per_page
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    StoreId:
      name: X-Store-ID
      in: header
      required: true
      description: Public Store ULID
      schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
  schemas:
    PaginationLinks:
      type: object
      required: [first, last, prev, next]
      properties:
        first: {type: string}
        last: {type: string}
        prev: {type: [string, 'null']}
        next: {type: [string, 'null']}
    PaginationMeta:
      type: object
      required: [current_page, from, last_page, path, per_page, to, total]
      properties:
        current_page: {type: integer, minimum: 1}
        from: {type: [integer, 'null'], minimum: 1}
        last_page: {type: integer, minimum: 1}
        path: {type: string}
        per_page: {type: integer, minimum: 1, maximum: 100}
        to: {type: [integer, 'null'], minimum: 1}
        total: {type: integer, minimum: 0}
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, example: ok}
        checks: {type: object, additionalProperties: {type: string}}
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation, store_name, store_slug]
      properties:
        name: {type: string, maxLength: 255}
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 12}
        password_confirmation: {type: string, format: password}
        store_name: {type: string, maxLength: 255}
        store_slug: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
    User:
      type: object
      required: [id, name, email, scope]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        name: {type: string}
        email: {type: string, format: email}
        scope: {type: string, enum: [platform, store], description: Exclusive account class}
        email_verified_at: {type: [string, 'null'], format: date-time}
    PersonalAccessToken:
      type: object
      required: [id, name, store_id, abilities, last_used_at, expires_at, created_at]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        name: {type: string}
        store_id: {type: [string, 'null'], pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        abilities: {type: array, items: {type: string}}
        last_used_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        created_at: {type: [string, 'null'], format: date-time}
    ManagedUser:
      allOf:
        - {$ref: '#/components/schemas/User'}
        - type: object
          required: [roles]
          properties:
            roles: {type: array, items: {type: string}}
    CreateManagedUserRequest:
      type: object
      required: [name, email, password, password_confirmation, roles]
      properties:
        name: {type: string, maxLength: 120}
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 12, writeOnly: true}
        password_confirmation: {type: string, format: password, writeOnly: true}
        roles: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
    UpdateManagedUserRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: {type: string, maxLength: 120}
        email: {type: string, format: email}
        password: {type: [string, 'null'], format: password, minLength: 12, writeOnly: true}
        password_confirmation: {type: [string, 'null'], format: password, writeOnly: true}
        roles: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
    ManagedUserResponse:
      type: object
      properties:
        data: {$ref: '#/components/schemas/ManagedUser'}
    ManagedUserListResponse:
      type: object
      required: [data, links, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/ManagedUser'}}
        links: {$ref: '#/components/schemas/PaginationLinks'}
        meta: {$ref: '#/components/schemas/PaginationMeta'}
    RoleListResponse:
      type: object
      properties:
        data: {type: array, items: {type: string}}
    CreateMerchantRequest:
      type: object
      required: [owner, store]
      properties:
        owner:
          type: object
          required: [name, email, password, password_confirmation]
          properties:
            name: {type: string, maxLength: 120}
            email: {type: string, format: email}
            password: {type: string, format: password, minLength: 12, writeOnly: true}
            password_confirmation: {type: string, format: password, writeOnly: true}
        store:
          type: object
          required: [name, slug]
          properties:
            name: {type: string, maxLength: 120}
            slug: {type: string, pattern: '^[a-z0-9_-]+$'}
            legal_name: {type: [string, 'null']}
            description: {type: [string, 'null']}
            email: {type: [string, 'null'], format: email}
            phone: {type: [string, 'null']}
            industry: {type: [string, 'null']}
            business_type: {type: [string, 'null'], enum: [ecommerce, b2b, services, digital, restaurant, marketplace, null]}
            currency_code: {type: string, pattern: '^[A-Za-z]{3}$'}
            language_code: {type: string}
            timezone: {type: string}
            country_code: {type: [string, 'null'], pattern: '^[A-Za-z]{2}$'}
        roles: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
    Merchant:
      type: object
      required: [store, owner, users]
      properties:
        store: {$ref: '#/components/schemas/Store'}
        owner:
          oneOf:
            - {$ref: '#/components/schemas/ManagedUser'}
            - {type: 'null'}
        users: {type: array, items: {$ref: '#/components/schemas/ManagedUser'}}
    UpdateMerchantRequest:
      type: object
      required: [owner, store]
      properties:
        owner:
          type: object
          required: [name, email]
          properties:
            name: {type: string, maxLength: 120}
            email: {type: string, format: email}
            password: {type: [string, 'null'], format: password, minLength: 12, writeOnly: true}
            password_confirmation: {type: [string, 'null'], format: password, writeOnly: true}
        store:
          type: object
          required: [name, slug, status]
          properties:
            name: {type: string, maxLength: 120}
            slug: {type: string, pattern: '^[a-z0-9_-]+$'}
            legal_name: {type: [string, 'null']}
            description: {type: [string, 'null']}
            email: {type: [string, 'null'], format: email}
            phone: {type: [string, 'null']}
            industry: {type: [string, 'null']}
            business_type: {type: [string, 'null'], enum: [ecommerce, b2b, services, digital, restaurant, marketplace, null]}
            currency_code: {type: string, pattern: '^[A-Za-z]{3}$'}
            language_code: {type: string}
            timezone: {type: string}
            country_code: {type: [string, 'null'], pattern: '^[A-Za-z]{2}$'}
            status: {type: string, enum: [pending, active, suspended, cancelled]}
    Store:
      type: object
      description: Public Store data. Internal bigint id, plan_id, and subscription_id are never serialized.
      required: [id, name, slug, status, currency_code, language_code, timezone, is_verified, is_ai_enabled, is_pos_enabled, is_b2b_enabled, is_marketplace_enabled]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        name: {type: string}
        legal_name: {type: [string, 'null']}
        description: {type: [string, 'null']}
        email: {type: [string, 'null'], format: email}
        phone: {type: [string, 'null']}
        slug: {type: string}
        status: {type: string, enum: [pending, active, suspended, cancelled]}
        primary_domain: {type: [string, 'null']}
        logo: {type: [string, 'null']}
        favicon: {type: [string, 'null']}
        cover_image: {type: [string, 'null']}
        industry: {type: [string, 'null']}
        business_type: {type: [string, 'null'], enum: [ecommerce, b2b, services, digital, restaurant, marketplace, null]}
        currency_code: {type: string, minLength: 3, maxLength: 3}
        language_code: {type: string}
        timezone: {type: string}
        country_code: {type: [string, 'null'], minLength: 2, maxLength: 2}
        is_verified: {type: boolean}
        is_ai_enabled: {type: boolean}
        is_pos_enabled: {type: boolean}
        is_b2b_enabled: {type: boolean}
        is_marketplace_enabled: {type: boolean}
        launched_at: {type: [string, 'null'], format: date-time}
        trial_ends_at: {type: [string, 'null'], format: date-time}
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    PlatformStoreWriteFields:
      type: object
      description: Public Store fields only. Billing links, raw settings/metadata, preferences, owner data, and roles are prohibited.
      properties:
        name: {type: string, maxLength: 120}
        slug: {type: string, minLength: 3, maxLength: 80, pattern: '^[a-z0-9_-]+$'}
        legal_name: {type: [string, 'null'], maxLength: 255}
        description: {type: [string, 'null'], maxLength: 5000}
        email: {type: [string, 'null'], format: email}
        phone: {type: [string, 'null'], maxLength: 32}
        primary_domain: {type: [string, 'null'], maxLength: 253}
        logo: {type: [string, 'null'], maxLength: 2048}
        favicon: {type: [string, 'null'], maxLength: 2048}
        cover_image: {type: [string, 'null'], maxLength: 2048}
        industry: {type: [string, 'null'], maxLength: 120}
        business_type: {type: [string, 'null'], enum: [ecommerce, b2b, services, digital, restaurant, marketplace, null]}
        status: {type: string, enum: [pending, active, suspended, cancelled], default: pending}
        currency_code: {type: string, pattern: '^[A-Za-z]{3}$', description: Must be an active Platform currency code.}
        language_code: {type: string, maxLength: 10, description: Must be an active Platform language locale; hyphens normalize to underscores.}
        timezone: {type: string}
        country_code: {type: [string, 'null'], pattern: '^[A-Za-z]{2}$'}
        is_verified: {type: boolean}
        is_ai_enabled: {type: boolean}
        is_pos_enabled: {type: boolean}
        is_b2b_enabled: {type: boolean}
        is_marketplace_enabled: {type: boolean}
        launched_at: {type: [string, 'null'], format: date-time}
        trial_ends_at: {type: [string, 'null'], format: date-time}
    CreatePlatformStoreRequest:
      allOf:
        - {$ref: '#/components/schemas/PlatformStoreWriteFields'}
        - type: object
          required: [name, slug]
    UpdatePlatformStoreRequest:
      allOf:
        - {$ref: '#/components/schemas/PlatformStoreWriteFields'}
    StoreResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Store'}
    PaginatedStoreResponse:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Store'}
        links: {$ref: '#/components/schemas/PaginationLinks'}
        meta: {$ref: '#/components/schemas/PaginationMeta'}
    CreateStoreRequest:
      type: object
      required: [name, slug]
      properties:
        name: {type: string, maxLength: 120}
        slug: {type: string, pattern: '^[a-z0-9_-]+$'}
        legal_name: {type: [string, 'null'], maxLength: 255}
        description: {type: [string, 'null'], maxLength: 5000}
        email: {type: [string, 'null'], format: email}
        phone: {type: [string, 'null'], maxLength: 32}
        business_type: {type: [string, 'null'], enum: [ecommerce, b2b, services, digital, restaurant, marketplace, null]}
        currency_code: {type: string, pattern: '^[A-Za-z]{3}$', description: Must be an active Platform currency code}
        language_code: {type: string, description: Must be an active Platform language locale; hyphens normalize to underscores}
        timezone: {type: string}
        country_code: {type: [string, 'null'], pattern: '^[A-Za-z]{2}$'}
        preferences: {$ref: '#/components/schemas/StorePreferences'}
    UpdateStoreProfileRequest:
      type: object
      properties:
        name: {type: string, maxLength: 120}
        slug: {type: string, pattern: '^[a-z0-9_-]+$'}
        legal_name: {type: [string, 'null'], maxLength: 255}
        description: {type: [string, 'null'], maxLength: 5000}
        email: {type: [string, 'null'], format: email}
        phone: {type: [string, 'null'], maxLength: 32}
        primary_domain: {type: [string, 'null']}
        logo: {type: [string, 'null']}
        favicon: {type: [string, 'null']}
        cover_image: {type: [string, 'null']}
        industry: {type: [string, 'null']}
        business_type: {type: [string, 'null'], enum: [ecommerce, b2b, services, digital, restaurant, marketplace, null]}
    UpdateStoreSettingsRequest:
      type: object
      properties:
        currency_code: {type: string, pattern: '^[A-Za-z]{3}$', description: Must be an active Platform currency code}
        language_code: {type: string, description: Must be an active Platform language locale; hyphens normalize to underscores}
        timezone: {type: string}
        country_code: {type: [string, 'null'], pattern: '^[A-Za-z]{2}$'}
        preferences: {$ref: '#/components/schemas/StorePreferences'}
    StorePreferences:
      type: object
      additionalProperties: false
      properties:
        order_prefix: {type: string, maxLength: 12}
        date_format: {type: string, enum: ['Y-m-d', 'd/m/Y', 'm/d/Y']}
        time_format: {type: string, enum: [12h, 24h]}
        weight_unit: {type: string, enum: [kg, lb]}
        dimension_unit: {type: string, enum: [cm, in]}
        inventory_tracking: {type: boolean}
        guest_checkout: {type: boolean}
        tax_inclusive_pricing: {type: boolean}
        low_stock_threshold: {type: integer, minimum: 0, maximum: 1000000}
        support_email: {type: [string, 'null'], format: email}
    Plan:
      type: object
      required: [id, name, slug, price, status, is_featured, sort_order, features]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        name: {type: string}
        slug: {type: string}
        description: {type: [string, 'null']}
        best_for: {type: [string, 'null']}
        price:
          type: object
          properties:
            amount_minor: {type: [integer, 'null'], minimum: 0}
            currency_code: {type: string, pattern: '^[A-Z]{3}$'}
            billing_interval: {type: [string, 'null'], enum: [month, year, null]}
            is_custom: {type: boolean}
        status: {type: string, enum: [draft, active, archived]}
        is_featured: {type: boolean}
        sort_order: {type: integer}
        features: {type: array, items: {$ref: '#/components/schemas/PlanFeature'}}
    Feature:
      type: object
      required: [id, key, name, value_type, is_addon_eligible, is_active]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        key: {type: string, pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'}
        name: {type: string}
        description: {type: [string, 'null']}
        value_type: {type: string, enum: [boolean, integer, decimal, text]}
        unit: {type: [string, 'null']}
        is_addon_eligible: {type: boolean}
        is_active: {type: boolean}
    PlanFeature:
      type: object
      required: [id, feature, is_included, is_addon, sort_order]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        feature: {$ref: '#/components/schemas/Feature'}
        value: {}
        is_included: {type: boolean}
        is_addon: {type: boolean}
        addon_price:
          type: [object, 'null']
          properties:
            amount_minor: {type: [integer, 'null'], minimum: 0}
            currency_code: {type: [string, 'null']}
            billing_interval: {type: [string, 'null'], enum: [month, year, null]}
        sort_order: {type: integer}
    PlanWriteRequest:
      type: object
      properties:
        name: {type: string, maxLength: 120}
        slug: {type: string}
        description: {type: [string, 'null']}
        best_for: {type: [string, 'null']}
        price_amount: {type: [integer, 'null'], minimum: 0, description: Integer minor units}
        currency_code: {type: string, pattern: '^[A-Za-z]{3}$'}
        billing_interval: {type: [string, 'null'], enum: [month, year, null]}
        is_custom_pricing: {type: boolean}
        status: {type: string, enum: [draft, active, archived]}
        is_featured: {type: boolean}
        sort_order: {type: integer, minimum: 0}
    FeatureWriteRequest:
      type: object
      properties:
        key: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        value_type: {type: string, enum: [boolean, integer, decimal, text]}
        unit: {type: [string, 'null']}
        is_addon_eligible: {type: boolean}
        is_active: {type: boolean}
    PlanFeatureWriteRequest:
      type: object
      properties:
        value: {}
        is_included: {type: boolean}
        is_addon: {type: boolean}
        addon_price_amount: {type: [integer, 'null'], minimum: 0}
        addon_currency_code: {type: [string, 'null'], pattern: '^[A-Za-z]{3}$'}
        addon_billing_interval: {type: [string, 'null'], enum: [month, year, null]}
        sort_order: {type: integer, minimum: 0}
    Currency:
      type: object
      required: [id, name, code, symbol, symbol_position, decimal_places, usd_exchange_rate, is_base, is_active]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        name: {type: string, maxLength: 100}
        code: {type: string, pattern: '^[A-Z]{3}$'}
        symbol: {type: string, maxLength: 16}
        symbol_position: {type: string, enum: [before, after]}
        decimal_places: {type: integer, minimum: 0, maximum: 4}
        usd_exchange_rate:
          type: [string, 'null']
          pattern: '^[0-9]+(?:\.[0-9]{8})$'
          description: Target currency units per 1 USD; null means unconfigured.
        is_base: {type: boolean}
        is_active: {type: boolean}
        exchange_rate_updated_at: {type: [string, 'null'], format: date-time}
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    CreateCurrencyRequest:
      type: object
      required: [name, code, symbol, symbol_position, decimal_places]
      properties:
        name: {type: string, maxLength: 100}
        code: {type: string, pattern: '^[A-Za-z]{3}$', description: Normalized to uppercase; USD is reserved.}
        symbol: {type: string, maxLength: 16}
        symbol_position: {type: string, enum: [before, after]}
        decimal_places: {type: integer, minimum: 0, maximum: 4}
        usd_exchange_rate:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 999999999999.99999999
          description: Target currency units per 1 USD.
        is_active: {type: boolean, default: true}
    UpdateCurrencyRequest:
      type: object
      minProperties: 1
      properties:
        name: {type: string, maxLength: 100}
        symbol: {type: string, maxLength: 16}
        symbol_position: {type: string, enum: [before, after]}
        decimal_places: {type: integer, minimum: 0, maximum: 4}
        usd_exchange_rate:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 999999999999.99999999
          description: Target currency units per 1 USD; null clears a non-base rate.
        is_active: {type: boolean}
    Language:
      type: object
      required: [id, name, native_name, locale, direction, is_active]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        name: {type: string, maxLength: 100}
        native_name: {type: string, maxLength: 100}
        locale: {type: string, maxLength: 10, pattern: '^[a-z]{2,3}(?:_[A-Z]{2})?$'}
        direction: {type: string, enum: [ltr, rtl]}
        is_active: {type: boolean}
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    StoreLanguageOption:
      type: object
      required: [id, name, native_name, locale, direction, is_selected, is_default]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        name: {type: string}
        native_name: {type: string}
        locale: {type: string}
        direction: {type: string, enum: [ltr, rtl]}
        is_selected: {type: boolean}
        is_default: {type: boolean}
    CreateLanguageRequest:
      type: object
      required: [name, native_name, locale, direction]
      properties:
        name: {type: string, maxLength: 100}
        native_name: {type: string, maxLength: 100}
        locale: {type: string, maxLength: 10}
        direction: {type: string, enum: [ltr, rtl]}
        is_active: {type: boolean, default: true}
    UpdateLanguageRequest:
      type: object
      minProperties: 1
      properties:
        name: {type: string, maxLength: 100}
        native_name: {type: string, maxLength: 100}
        direction: {type: string, enum: [ltr, rtl]}
        is_active: {type: boolean}
    UpdateStoreLanguagesRequest:
      type: object
      required: [language_ids, default_language_id]
      properties:
        language_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        default_language_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: Must be included in language_ids.
    StoreLanguagesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [store_id, default_language_id, languages]
          properties:
            store_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
            default_language_id: {type: [string, 'null'], pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
            languages:
              type: array
              items: {$ref: '#/components/schemas/StoreLanguageOption'}
    AccessInterfacesResponse:
      type: object
      description: Exactly one of platform_admin.available or store_admin.available can be true.
      required: [data]
      properties:
        data:
          type: object
          required: [platform_admin, store_admin]
          properties:
            platform_admin:
              type: object
              required: [interface, label, available, roles, permissions, navigation]
              properties:
                interface: {type: string, const: platform_admin}
                label: {type: string, example: Platform Admin (SaaS Owner)}
                available: {type: boolean}
                roles: {type: array, items: {type: string}}
                permissions: {type: array, items: {type: string}}
                navigation:
                  type: array
                  items:
                    type: object
                    required: [key, label, path, permission]
                    properties:
                      key: {type: string, example: platform_settings}
                      label: {type: string, example: Settings}
                      path: {type: string, example: /admin/settings}
                      permission: {type: string, example: manage platform settings}
            store_admin:
              type: object
              required: [interface, label, available, stores]
              properties:
                interface: {type: string, const: store_admin}
                label: {type: string, example: Store Admin (Merchant)}
                available: {type: boolean}
                stores:
                  type: array
                  items:
                    type: object
                    required: [id, name, slug, status, roles, permissions]
                    properties:
                      id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
                      name: {type: string}
                      slug: {type: string}
                      status: {type: string}
                      roles: {type: array, items: {type: string}}
                      permissions: {type: array, items: {type: string}}
    DashboardSessionResponse:
      allOf:
        - {$ref: '#/components/schemas/AccessInterfacesResponse'}
        - type: object
          required: [user]
          properties:
            user: {$ref: '#/components/schemas/User'}
  responses:
    Unauthenticated:
      description: Authentication required
      content: {application/json: {schema: {type: object, properties: {message: {type: string}}}}}
    Forbidden:
      description: Forbidden
      content: {application/json: {schema: {type: object, properties: {message: {type: string}}}}}
    ValidationError:
      description: Validation failed
      content: {application/json: {schema: {type: object, properties: {message: {type: string}, errors: {type: object}}}}}
