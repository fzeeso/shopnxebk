        content: {type: string, maxLength: 1000000, description: Markdown or previously sanitized HTML.}
        seo_title: {type: [string, 'null'], maxLength: 255}
        seo_description: {type: [string, 'null'], maxLength: 1000}
        lock_it: {type: boolean, default: false, description: Prevent automated translation writers from overwriting this merchant-authored record.}
    StorePolicyTranslation:
      type: object
      required: [id, language, title, content, lock_it]
      properties:
        id: {$ref: '#/components/schemas/PublicUlid'}
        language: {$ref: '#/components/schemas/Language'}
        title: {type: string}
        content: {type: string}
        seo_title: {type: [string, 'null']}
        seo_description: {type: [string, 'null']}
        lock_it: {type: boolean}
        translation_request:
          oneOf:
            - {$ref: '#/components/schemas/TranslationRequest'}
            - {type: 'null'}
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    StorePolicy:
      type: object
      required: [id, policy_type, title, slug, status, translations]
      properties:
        id: {$ref: '#/components/schemas/PublicUlid'}
        store_id: {$ref: '#/components/schemas/PublicUlid'}
        policy_type: {$ref: '#/components/schemas/PolicyType'}
        title: {type: string}
        slug: {type: string}
        status: {type: string, enum: [disabled, draft, published]}
        published_at: {type: [string, 'null'], format: date-time}
        created_by: {oneOf: [{$ref: '#/components/schemas/PublicUlid'}, {type: 'null'}]}
        updated_by: {oneOf: [{$ref: '#/components/schemas/PublicUlid'}, {type: 'null'}]}
        translations: {type: array, items: {$ref: '#/components/schemas/StorePolicyTranslation'}}
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    PolicyVersion:
      type: object
      required: [id, language, version, content]
      properties:
        id: {$ref: '#/components/schemas/PublicUlid'}
        language: {$ref: '#/components/schemas/Language'}
        version: {type: integer, minimum: 1}
        content: {type: string}
        created_by: {oneOf: [{$ref: '#/components/schemas/PublicUlid'}, {type: 'null'}]}
        created_at: {type: [string, 'null'], format: date-time}
    StorefrontPolicy:
      type: object
      required: [id, type, title, slug, locale, content, published_at]
      properties:
        id: {$ref: '#/components/schemas/PublicUlid'}
        type:
          type: object
          required: [code, name]
          properties:
            code: {type: string}
            name: {type: string}
        title: {type: string}
        slug: {type: string}
        locale: {type: string}
        content: {type: string}
        seo_title: {type: [string, 'null']}
        seo_description: {type: [string, 'null']}
        published_at: {type: string, format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    Language:
      type: object
      required: [id, name, native_name, lang_icon, lang_image, locale, direction, is_active]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        name: {type: string, maxLength: 100}
        native_name: {type: string, maxLength: 100}
        lang_icon: {type: string, format: uri, description: Absolute render URL for the language country-flag icon.}
        lang_image: {type: string, format: uri, description: Absolute render URL for the language selector image.}
        locale: {type: string, maxLength: 10, pattern: '^[a-z]{2,3}(?:_[A-Z]{2})?$'}
        direction: {type: string, enum: [ltr, rtl]}
        is_active: {type: boolean}
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    StoreLanguageOption:
      type: object
      required: [id, name, native_name, lang_icon, lang_image, locale, direction, is_selected, is_default]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        name: {type: string}
        native_name: {type: string}
        lang_icon: {type: string, format: uri, description: Absolute render URL for the language country-flag icon.}
        lang_image: {type: string, format: uri, description: Absolute render URL for the language selector image.}
        locale: {type: string}
        direction: {type: string, enum: [ltr, rtl]}
        is_selected: {type: boolean}
        is_default: {type: boolean}
    FulfillmentTypeTranslation:
      type: object
      required: [id, locale, name, description]
      properties:
        id: {type: integer, format: int64}
        locale: {type: string, maxLength: 10}
        name: {type: string, maxLength: 255}
        description: {type: [string, 'null']}
    FulfillmentType:
      type: object
      required: [id, code, is_active, sort_order, created_at, updated_at, translations]
      properties:
        id: {type: integer, format: int64}
        code: {type: string, maxLength: 100}
        is_active: {type: boolean}
        sort_order: {type: integer, minimum: 0}
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
        translations:
          type: array
          items: {$ref: '#/components/schemas/FulfillmentTypeTranslation'}
    FulfillmentTypesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/FulfillmentType'}
    FulfillmentTypeResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/FulfillmentType'}
    FulfillmentTypeTranslationWrite:
      type: object
      required: [locale, name]
      properties:
        locale: {type: string, maxLength: 10, description: Must exist in the Language catalog.}
        name: {type: string, maxLength: 255}
        description: {type: [string, 'null']}
    CreateFulfillmentTypeRequest:
      type: object
      required: [code, translations]
      properties:
        code: {type: string, maxLength: 100, pattern: '^[a-z][a-z0-9_]*$'}
        is_active: {type: boolean, default: true}
        sort_order: {type: integer, minimum: 0, default: 0}
        translations:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/FulfillmentTypeTranslationWrite'}
    UpdateFulfillmentTypeRequest:
      type: object
      minProperties: 1
      properties:
        is_active: {type: boolean}
        sort_order: {type: integer, minimum: 0}
        translations:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/FulfillmentTypeTranslationWrite'}
    CreateLanguageRequest:
      type: object
      required: [name, native_name, locale, direction]
      properties:
        name: {type: string, maxLength: 100}
        native_name: {type: string, maxLength: 100}
        locale: {type: string, maxLength: 10}
        lang_icon: {type: string, format: uri-reference, maxLength: 2048, default: /assets/languages/flags/generic.svg}
        lang_image: {type: string, format: uri-reference, maxLength: 2048, default: /assets/languages/flags/generic.svg}
        direction: {type: string, enum: [ltr, rtl]}
        is_active: {type: boolean, default: true}
    UpdateLanguageRequest:
      type: object
      minProperties: 1
      properties:
        name: {type: string, maxLength: 100}
        native_name: {type: string, maxLength: 100}
        lang_icon: {type: string, format: uri-reference, maxLength: 2048}
        lang_image: {type: string, format: uri-reference, maxLength: 2048}
        direction: {type: string, enum: [ltr, rtl]}
        is_active: {type: boolean}
    UpdateStoreLanguagesRequest:
      type: object
      required: [language_ids, default_language_id]
      properties:
        language_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        default_language_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: Must be included in language_ids.
    StoreLanguagesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [store_id, default_language_id, languages]
          properties:
            store_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
            default_language_id: {type: [string, 'null'], pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
            languages:
              type: array
              items: {$ref: '#/components/schemas/StoreLanguageOption'}
    AccessInterfacesResponse:
      type: object
      description: Exactly one of platform_admin.available or store_admin.available can be true.
      required: [data]
      properties:
        data:
          type: object
          required: [platform_admin, store_admin]
          properties:
            platform_admin:
              type: object
              required: [interface, label, available, roles, permissions, navigation]
              properties:
                interface: {type: string, const: platform_admin}
                label: {type: string, example: Platform Admin (SaaS Owner)}
                available: {type: boolean}
                roles: {type: array, items: {type: string}}
                permissions: {type: array, items: {type: string}}
                navigation:
                  type: array
                  items:
                    type: object
                    required: [key, label, path, permission]
                    properties:
                      key: {type: string, example: platform_settings}
                      label: {type: string, example: Settings}
                      path: {type: string, example: /admin/settings}
                      permission: {type: string, example: manage platform settings}
            store_admin:
              type: object
              required: [interface, label, available, stores]
              properties:
                interface: {type: string, const: store_admin}
                label: {type: string, example: Store Admin (Merchant)}
                available: {type: boolean}
                stores:
                  type: array
                  items:
                    type: object
                    required: [id, name, slug, status, roles, permissions]
                    properties:
                      id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
                      name: {type: string}
                      slug: {type: string}
                      status: {type: string}
                      roles: {type: array, items: {type: string}}
                      permissions: {type: array, items: {type: string}}
    DashboardSessionResponse:
      allOf:
        - {$ref: '#/components/schemas/AccessInterfacesResponse'}
        - type: object
          required: [user]
          properties:
            user: {$ref: '#/components/schemas/User'}
  responses:
    Unauthenticated:
      description: Authentication required
      content: {application/json: {schema: {type: object, properties: {message: {type: string}}}}}
    Forbidden:
      description: Forbidden
      content: {application/json: {schema: {type: object, properties: {message: {type: string}}}}}
    ValidationError:
      description: Validation failed
      content: {application/json: {schema: {type: object, properties: {message: {type: string}, errors: {type: object}}}}}
