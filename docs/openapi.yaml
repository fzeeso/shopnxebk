        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product or supplied variant not found in the nested Store/Product boundary}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/store/products/{product}/images/{image}:
    parameters:
      - {$ref: '#/components/parameters/StoreId'}
      - {name: product, in: path, required: true, schema: {$ref: '#/components/schemas/PublicUlid'}}
      - {name: image, in: path, required: true, schema: {$ref: '#/components/schemas/PublicUlid'}}
