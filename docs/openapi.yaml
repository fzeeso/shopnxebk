    parameters:
      - {$ref: '#/components/parameters/StoreId'}
      - {name: storePolicy, in: path, required: true, schema: {$ref: '#/components/schemas/PublicUlid'}}
    post:
      tags: [Store Policies]
      security: [{sanctum: []}]
      summary: Return a policy to draft
      responses:
        '200': {description: Policy unpublished}
