openapi: 3.1.0
info:
  title: shopnxebk REST API
  version: 1.0.0
  description: Authentication, Store management, Theme marketplace, Platform settings, and Plans & Pricing endpoints. GraphQL is documented by the Lighthouse schema.
servers:
  - url: http://localhost:8000
tags:
  - name: Platform Accounts
    description: Platform staff and merchant provisioning for the separate admin frontend.
  - name: Platform Stores
    description: Searchable and paginated Store catalog administration for Platform staff.
  - name: Store Users
    description: Member and role management inside one selected Store.
  - name: Platform Settings
    description: Global SaaS language and currency configuration for the /admin/settings component.
  - name: Themes
    description: Platform marketplace/releases/licenses and Store-installed Theme copies.
  - name: Store Policies
    description: Platform policy-type catalog, Store-local translations/version history, and published storefront reads.
paths:
  /api/health/live:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Process is responding
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /api/health/ready:
    get:
      summary: Readiness probe
      responses:
        '200': {description: Dependencies are ready}
        '503': {description: A required dependency is unavailable}
  /api/v1/auth/register:
    post:
      summary: Register a user and first store
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: User and complete draft Store created
          content:
            application/json:
              schema:
                type: object
                required: [user, store, dashboard_url]
                properties:
                  user: {$ref: '#/components/schemas/User'}
                  store: {$ref: '#/components/schemas/Store'}
                  dashboard_url: {type: string, format: uri, description: Store Admin dashboard with the Store public ULID in the store query parameter.}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/auth/login:
    post:
      summary: Start a stateful session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200': {description: Session established}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: Rate limited}
  /api/v1/auth/token:
    post:
      summary: Issue a store-scoped bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name, store_id]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
                device_name: {type: string, maxLength: 255}
                store_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: Public Store ULID}
      responses:
        '200': {description: Plain Store-bound token returned once; expires after 30 days by default}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {description: Rate limited}
  /api/v1/auth/me:
    get:
      security: [{sanctum: []}]
      summary: Current user
      responses:
        '200':
          description: User resource including exclusive account scope
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/auth/session:
    get:
      security: [{sanctum: []}]
      summary: Bootstrap the authenticated dashboard session
      description: Returns the current User and exclusive Platform Admin/Store Admin interface profile atomically.
      responses:
        '200':
          description: Current User and scoped interface access profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardSessionResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/auth/interfaces:
    get:
      security: [{sanctum: []}]
      summary: Resolve Platform Admin and Store Admin interfaces
      description: Returns stable Platform and Store keys, but exclusive user scope permits only one interface to be available.
      responses:
        '200':
          description: Scoped interface access profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessInterfacesResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/auth/logout:
    post:
      security: [{sanctum: []}]
      summary: Revoke the current session or token
      responses:
        '200': {description: Logged out}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/auth/password:
    patch:
      security: [{sanctum: []}]
      summary: Change the signed-in user's password
      description: Available to both Platform and Store users. Verifies the current password, keeps the active browser session signed in, rotates session/remember credentials, revokes personal access tokens, and invalidates outstanding MFA challenges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: {type: string, format: password}
                password: {type: string, format: password, minLength: 12, description: Must contain uppercase, lowercase, a number, and a symbol and differ from current_password.}
                password_confirmation: {type: string, format: password}
      responses:
        '200':
          description: Password changed and personal API tokens revoked
          content:
            application/json:
              schema:
                type: object
                required: [message, tokens_revoked]
                properties:
                  message: {type: string, example: Password changed successfully.}
                  tokens_revoked: {type: integer, minimum: 0}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '419': {description: CSRF token mismatch or expired session}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: Rate limited to five attempts per minute per authenticated user}
  /api/v1/auth/stores:
    get:
      security: [{sanctum: []}]
      summary: List active memberships
      responses:
        '200':
          description: Public-safe Store resources
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Store'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {description: Platform account cannot list Stores}
  /api/v1/auth/tokens:
    get:
      security: [{sanctum: []}]
      summary: List the current account's personal access tokens
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Paginated personal access tokens
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PersonalAccessToken'}}
                  links: {$ref: '#/components/schemas/PaginationLinks'}
                  meta: {$ref: '#/components/schemas/PaginationMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/auth/forgot-password:
    post:
      summary: Queue a password reset notification
      responses:
        '202': {description: Generic response}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/auth/reset-password:
    post:
      summary: Reset a password with a broker token
      responses:
        '200': {description: Password reset}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/auth/verify-email/{id}/{hash}:
    get:
      summary: Verify a signed email link
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
        - {name: hash, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Email verified}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/platform/roles:
    get:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: List assignable Platform roles
      description: Requires Platform scope and manage platform users.
      responses:
        '200':
          description: Platform role names
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleListResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/platform/users:
    get:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: List Platform users
      description: Paginated; requires Platform scope and manage platform users.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Platform users and Platform roles
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedUserListResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: Create a Platform user
      description: Creates only a Platform-scoped identity and accepts only Platform roles.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateManagedUserRequest'}
      responses:
        '201':
          description: Platform user created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedUserResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/users/{user}:
    get:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: View a Platform user
      parameters:
        - {name: user, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
      responses:
        '200':
          description: Platform user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedUserResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Platform user not found}
    patch:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: Update a Platform user and Platform roles
      parameters:
        - {name: user, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateManagedUserRequest'}
      responses:
        '200': {description: Platform user updated}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Platform user not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/merchant-roles:
    get:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: List Store roles assignable during merchant provisioning
      description: Requires Platform scope and manage stores.
      responses:
        '200':
          description: Store role names
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleListResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/platform/merchants:
    get:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: List merchants
      description: Paginated Stores and their Store-scoped users/roles; requires manage stores.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Merchant list
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Merchant'}}
                  links: {$ref: '#/components/schemas/PaginationLinks'}
                  meta: {$ref: '#/components/schemas/PaginationMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: Create a merchant
      description: Atomically creates a Store user, draft Store, settings, platform domain, Theme license, published installed Theme copy, active membership, and Store roles; Owner is always included.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMerchantRequest'}
      responses:
        '201':
          description: Merchant created
          content:
            application/json:
              schema:
                type: object
                required: [data, dashboard_url]
                properties:
                  data: {$ref: '#/components/schemas/Merchant'}
                  dashboard_url: {type: string, format: uri}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/merchants/{merchant}:
    get:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: View a merchant by Store ULID
      parameters:
        - {name: merchant, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
      responses:
        '200': {description: Merchant resource}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Merchant not found}
    patch:
      tags: [Platform Accounts]
      security: [{sanctum: []}]
      summary: Update a merchant owner and Store
      description: Existing Store roles are preserved. A changed owner email becomes unverified.
      parameters:
        - {name: merchant, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMerchantRequest'}
      responses:
        '200': {description: Merchant updated}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Merchant not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/stores:
    get:
      tags: [Platform Stores]
      security: [{sanctum: []}]
      summary: Search, filter, sort, and paginate Stores
      description: Requires Platform scope and manage stores. Never send X-Store-ID.
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 120}, description: Case-insensitive Store name, legal name, slug, contact email, primary domain, or related Store-member name/email search.}
        - {name: status, in: query, schema: {type: string, enum: [draft, trial, active, suspended, frozen, closed]}}
        - {name: business_type, in: query, schema: {type: string, enum: [ecommerce, b2b, services, digital, restaurant, marketplace]}}
        - {name: currency_code, in: query, schema: {type: string, pattern: '^[A-Za-z]{3}$'}}
        - {name: language_code, in: query, schema: {type: string}}
        - {name: country_code, in: query, schema: {type: string, pattern: '^[A-Za-z]{2}$'}}
        - {name: is_verified, in: query, schema: {type: boolean}}
        - {name: is_ai_enabled, in: query, schema: {type: boolean}}
        - {name: is_pos_enabled, in: query, schema: {type: boolean}}
        - {name: is_b2b_enabled, in: query, schema: {type: boolean}}
        - {name: is_marketplace_enabled, in: query, schema: {type: boolean}}
        - {name: created_from, in: query, schema: {type: string, format: date}}
        - {name: created_to, in: query, schema: {type: string, format: date}}
        - {name: sort, in: query, schema: {type: string, enum: [name, slug, status, created_at, updated_at], default: created_at}}
        - {name: direction, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
      responses:
        '200':
          description: Paginated Store catalog
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaginatedStoreResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Platform Stores]
      security: [{sanctum: []}]
      summary: Create an unassigned Store
      description: Requires manage stores. Creates normalized locale/settings and platform/custom domain records, but no owner, membership, role, plan, or subscription; status defaults to draft.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePlatformStoreRequest'}
      responses:
        '201':
          description: Store created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/stores/{store}:
    parameters:
      - {name: store, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}, description: Public Store ULID}
    get:
      tags: [Platform Stores]
      security: [{sanctum: []}]
      summary: View a Store
      description: Requires Platform scope and manage stores.
      responses:
        '200':
          description: Store resource
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Store not found}
    patch:
      tags: [Platform Stores]
      security: [{sanctum: []}]
      summary: Edit a Store
      description: Internal Billing links, raw JSON, preferences, owner data, and roles are prohibited.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePlatformStoreRequest'}
      responses:
        '200':
          description: Store updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Store not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/stores/{store}/locale-settings:
    parameters:
      - {name: store, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}, description: Public Store ULID}
    get:
      tags: [Platform Stores]
      security: [{sanctum: []}]
      summary: View Store locale settings
      description: Requires Platform scope and manage stores. UTF-8 and automatic IANA timezone daylight-saving behavior are read-only managed standards.
      responses:
        '200':
          description: Unified Store regional and display-format settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreLocaleSettingsResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Store not found}
    patch:
      tags: [Platform Stores]
      security: [{sanctum: []}]
      summary: Update Store locale settings
      description: Updates Store currency/language/country/timezone and normalized display-format preferences in one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateStoreLocaleSettingsRequest'}
      responses:
        '200':
          description: Store locale settings updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreLocaleSettingsResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Store not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/stores/{store}/domains:
    parameters:
      - {name: store, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}, description: Public Store ULID}
    get:
      tags: [Platform Stores]
      security: [{sanctum: []}]
      summary: List Store domains
      description: Requires Platform scope and manage stores. Returns primary first, then hostname order.
      responses:
        '200':
          description: Normalized Store domain records
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreDomainsResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Store not found}
    post:
      tags: [Platform Stores]
      security: [{sanctum: []}]
      summary: Add a Store domain
      description: Hostnames are globally unique. The first domain is always primary; making a later domain primary updates stores.primary_domain transactionally.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateStoreDomainRequest'}
      responses:
        '201':
          description: Store domain created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreDomainResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Store not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/stores/{store}/domains/{domain}:
    parameters:
      - {name: store, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}, description: Public Store ULID}
      - {name: domain, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}, description: Public Store-domain ULID}
    patch:
      tags: [Platform Stores]
      security: [{sanctum: []}]
      summary: Update a Store domain
      description: Updates hostname/type/routing/SSL/verification state and primary selection. A current primary can only be replaced by making another domain primary.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateStoreDomainRequest'}
      responses:
        '200':
          description: Store domain updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreDomainResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Store or domain not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/store/roles:
    get:
      tags: [Store Users]
      security: [{sanctum: []}]
      summary: List roles for the selected Store
      parameters: [{$ref: '#/components/parameters/StoreId'}]
      responses:
        '200':
          description: Store role names
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleListResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/store/users:
    get:
      tags: [Store Users]
      security: [{sanctum: []}]
      summary: List users in the selected Store
      parameters:
        - {$ref: '#/components/parameters/StoreId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Paginated Store members, memberships, and Store roles
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedUserListResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Store Users]
      security: [{sanctum: []}]
      summary: Create a user in the selected Store
      description: Requires manage store members and manage store roles. Only Store roles are accepted.
      parameters: [{$ref: '#/components/parameters/StoreId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateManagedUserRequest'}
      responses:
        '201': {description: Store user and active membership created}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/platform/settings/currencies:
    get:
      tags: [Platform Settings]
      security: [{sanctum: []}]
      summary: List the platform currency catalog
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Paginated platform currency catalog
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Currency'}
                  links: {$ref: '#/components/schemas/PaginationLinks'}
