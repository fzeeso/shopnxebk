            application/json: {schema: {$ref: '#/components/schemas/ProductImagePageResponse'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product not found in selected Store}
    post:
      tags: [Catalog Products]
      security: [{sanctum: []}]
      summary: Add image metadata to a Product
