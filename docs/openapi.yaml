            application/json: {schema: {$ref: '#/components/schemas/ProductSharedOptionAssignmentResponse'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Product or shared option not found in selected Store}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/store/products/{product}/shared-options/{assignment}:
    parameters:
      - {$ref: '#/components/parameters/StoreId'}
