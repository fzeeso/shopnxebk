      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateStorePolicyRequest'}}}
      responses:
        '201': {description: Disabled policy created}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
