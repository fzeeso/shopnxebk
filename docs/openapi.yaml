      required: [code, name]
      properties:
        code: {type: string, pattern: '^[a-z][a-z0-9_-]{0,79}$'}
        name: {type: string, maxLength: 160}
        description: {type: [string, 'null'], maxLength: 5000}
        sort_order: {type: integer, minimum: 0}
    UpdatePolicyTypeRequest:
      type: object
      minProperties: 1
      properties:
        code: {type: string, pattern: '^[a-z][a-z0-9_-]{0,79}$'}
        name: {type: string, maxLength: 160}
        description: {type: [string, 'null'], maxLength: 5000}
        sort_order: {type: integer, minimum: 0}
    CreateStorePolicyRequest:
      type: object
      required: [policy_type_id, title]
      properties:
        policy_type_id: {$ref: '#/components/schemas/PublicUlid'}
        title: {type: string, maxLength: 255}
        slug: {type: [string, 'null'], maxLength: 160, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
    UpdateStorePolicyRequest:
      type: object
      minProperties: 1
      properties:
        title: {type: string, maxLength: 255}
        slug: {type: string, maxLength: 160, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
    StorePolicyTranslationRequest:
      type: object
      required: [title, content]
      properties:
        title: {type: string, maxLength: 255}
        content: {type: string, maxLength: 1000000, description: Markdown or previously sanitized HTML.}
        seo_title: {type: [string, 'null'], maxLength: 255}
        seo_description: {type: [string, 'null'], maxLength: 1000}
    StorePolicyTranslation:
      type: object
      required: [id, language, title, content]
      properties:
        id: {$ref: '#/components/schemas/PublicUlid'}
        language: {$ref: '#/components/schemas/Language'}
        title: {type: string}
        content: {type: string}
        seo_title: {type: [string, 'null']}
        seo_description: {type: [string, 'null']}
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    StorePolicy:
      type: object
      required: [id, policy_type, title, slug, status, translations]
      properties:
        id: {$ref: '#/components/schemas/PublicUlid'}
        store_id: {$ref: '#/components/schemas/PublicUlid'}
        policy_type: {$ref: '#/components/schemas/PolicyType'}
        title: {type: string}
        slug: {type: string}
        status: {type: string, enum: [draft, published]}
        published_at: {type: [string, 'null'], format: date-time}
        created_by: {oneOf: [{$ref: '#/components/schemas/PublicUlid'}, {type: 'null'}]}
        updated_by: {oneOf: [{$ref: '#/components/schemas/PublicUlid'}, {type: 'null'}]}
        translations: {type: array, items: {$ref: '#/components/schemas/StorePolicyTranslation'}}
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    PolicyVersion:
      type: object
      required: [id, language, version, content]
      properties:
        id: {$ref: '#/components/schemas/PublicUlid'}
        language: {$ref: '#/components/schemas/Language'}
        version: {type: integer, minimum: 1}
        content: {type: string}
        created_by: {oneOf: [{$ref: '#/components/schemas/PublicUlid'}, {type: 'null'}]}
        created_at: {type: [string, 'null'], format: date-time}
    StorefrontPolicy:
      type: object
      required: [id, type, title, slug, locale, content, published_at]
      properties:
        id: {$ref: '#/components/schemas/PublicUlid'}
        type:
          type: object
          required: [code, name]
          properties:
            code: {type: string}
            name: {type: string}
        title: {type: string}
        slug: {type: string}
        locale: {type: string}
        content: {type: string}
        seo_title: {type: [string, 'null']}
        seo_description: {type: [string, 'null']}
        published_at: {type: string, format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    Language:
      type: object
      required: [id, name, native_name, locale, direction, is_active]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        name: {type: string, maxLength: 100}
        native_name: {type: string, maxLength: 100}
        locale: {type: string, maxLength: 10, pattern: '^[a-z]{2,3}(?:_[A-Z]{2})?$'}
        direction: {type: string, enum: [ltr, rtl]}
        is_active: {type: boolean}
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    StoreLanguageOption:
      type: object
      required: [id, name, native_name, locale, direction, is_selected, is_default]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        name: {type: string}
        native_name: {type: string}
        locale: {type: string}
        direction: {type: string, enum: [ltr, rtl]}
        is_selected: {type: boolean}
        is_default: {type: boolean}
    CreateLanguageRequest:
      type: object
      required: [name, native_name, locale, direction]
      properties:
        name: {type: string, maxLength: 100}
        native_name: {type: string, maxLength: 100}
        locale: {type: string, maxLength: 10}
        direction: {type: string, enum: [ltr, rtl]}
        is_active: {type: boolean, default: true}
    UpdateLanguageRequest:
      type: object
      minProperties: 1
      properties:
        name: {type: string, maxLength: 100}
        native_name: {type: string, maxLength: 100}
        direction: {type: string, enum: [ltr, rtl]}
        is_active: {type: boolean}
    UpdateStoreLanguagesRequest:
      type: object
      required: [language_ids, default_language_id]
      properties:
        language_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        default_language_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: Must be included in language_ids.
    StoreLanguagesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [store_id, default_language_id, languages]
          properties:
            store_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
            default_language_id: {type: [string, 'null'], pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
            languages:
              type: array
              items: {$ref: '#/components/schemas/StoreLanguageOption'}
    AccessInterfacesResponse:
      type: object
      description: Exactly one of platform_admin.available or store_admin.available can be true.
      required: [data]
      properties:
        data:
          type: object
          required: [platform_admin, store_admin]
          properties:
            platform_admin:
              type: object
              required: [interface, label, available, roles, permissions, navigation]
              properties:
                interface: {type: string, const: platform_admin}
                label: {type: string, example: Platform Admin (SaaS Owner)}
                available: {type: boolean}
                roles: {type: array, items: {type: string}}
                permissions: {type: array, items: {type: string}}
                navigation:
                  type: array
                  items:
                    type: object
                    required: [key, label, path, permission]
                    properties:
                      key: {type: string, example: platform_settings}
                      label: {type: string, example: Settings}
                      path: {type: string, example: /admin/settings}
                      permission: {type: string, example: manage platform settings}
            store_admin:
              type: object
              required: [interface, label, available, stores]
              properties:
                interface: {type: string, const: store_admin}
                label: {type: string, example: Store Admin (Merchant)}
                available: {type: boolean}
                stores:
                  type: array
                  items:
                    type: object
                    required: [id, name, slug, status, roles, permissions]
                    properties:
                      id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
                      name: {type: string}
                      slug: {type: string}
                      status: {type: string}
                      roles: {type: array, items: {type: string}}
                      permissions: {type: array, items: {type: string}}
    DashboardSessionResponse:
      allOf:
        - {$ref: '#/components/schemas/AccessInterfacesResponse'}
        - type: object
          required: [user]
          properties:
            user: {$ref: '#/components/schemas/User'}
  responses:
    Unauthenticated:
      description: Authentication required
      content: {application/json: {schema: {type: object, properties: {message: {type: string}}}}}
    Forbidden:
      description: Forbidden
      content: {application/json: {schema: {type: object, properties: {message: {type: string}}}}}
    ValidationError:
      description: Validation failed
      content: {application/json: {schema: {type: object, properties: {message: {type: string}, errors: {type: object}}}}}
